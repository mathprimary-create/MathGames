<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Train Number Journey</title>
<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif; 
    background: #bdeeff; 
    color: #222; 
    overflow-x: hidden; 
    user-select: none;
  }
  
  .screen { 
    display: none; 
    min-height: 100vh; 
    padding: 20px; 
    text-align: center; 
  }
  .screen.active { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
  }
  
  .card { 
    background: rgba(255, 255, 255, 0.95); 
    border-radius: 32px; 
    padding: 30px; 
    max-width: 700px; 
    width: 95%; 
    box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
    border: 6px solid #174ea6;
    animation: popIn 0.5s ease-out;
  }
  
  @keyframes popIn {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Innovine Splash Screen Elements */
  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .innovine-logo {
    max-width: 220px;
    width: 100%;
    height: auto;
    margin-bottom: 20px;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.1));
    animation: pulseLogo 2s infinite ease-in-out;
  }
  @keyframes pulseLogo {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  h1 { color: #174ea6; font-size: clamp(28px, 5vw, 44px); margin: 10px 0; }
  h2 { color: #0b8043; font-size: clamp(20px, 4vw, 30px); margin-top: 5px; }
  p { font-size: 18px; line-height: 1.5; color: #444; }
  
  button { 
    border: 0; 
    border-radius: 20px; 
    padding: 16px 36px; 
    font-size: 22px; 
    font-weight: bold; 
    cursor: pointer; 
    background: #ffbf00; 
    color: #4a2b00; 
    box-shadow: 0 6px 0 #c58b00; 
    margin: 15px 8px;
    transition: all 0.1s ease;
  }
  button:hover { background: #ffcc33; }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #c58b00; }

  /* Game Layout Viewport */
  .game-area { 
    position: relative; 
    min-height: 100vh; 
    background: linear-gradient(to bottom, #bdeeff 0%, #e0f7fa 70%, #81c784 100%);
    padding: 15px; 
    overflow: hidden; 
    display: none; 
    flex-direction: column; 
    justify-content: space-between;
  }

  /* Parallax Floating Clouds */
  .cloud { position: absolute; background: #fff; border-radius: 100px; opacity: 0.85; pointer-events: none; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  
  /* Fast Cloud */
  .cloud.one { width: 120px; height: 40px; top: 40px; left: -150px; animation: floatCloud 22s linear infinite; }
  .cloud.one::before { width: 50px; height: 50px; top: -25px; left: 15px; }
  .cloud.one::after { width: 60px; height: 60px; top: -30px; left: 45px; }
  
  /* Slow Cloud */
  .cloud.two { width: 160px; height: 50px; top: 110px; left: -200px; animation: floatCloud 38s linear infinite; }
  .cloud.two::before { width: 65px; height: 65px; top: -30px; left: 20px; }
  .cloud.two::after { width: 80px; height: 80px; top: -40px; left: 60px; }

  @keyframes floatCloud {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(100vw + 250px)); }
  }

  /* Top Dashboard HUD */
  .topbar { 
    display: flex; 
    justify-content: space-around; 
    width: 100%; 
    max-width: 850px; 
    margin: 0 auto; 
    background: rgba(255,255,255,0.9); 
    padding: 12px 20px; 
    border-radius: 20px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    font-size: clamp(16px, 3.5vw, 22px);
    font-weight: bold;
    z-index: 10;
    border: 3px solid #74b9ff;
  }
  .timer { color: #d93025; }
  .score { color: #fbbc04; text-shadow: 1px 1px 0 #856404; }
  .attempts { color: #0b8043; }

  /* Track Zone and Engine Rendering */
  .track-zone { 
    position: relative; 
    max-width: 850px; 
    width: 100%;
    height: 120px; 
    margin: 15px auto; 
    z-index: 5;
  }
  .track { 
    position: absolute; 
    bottom: 10px; 
    left: 0; 
    width: 100%; 
    height: 16px; 
    background: repeating-linear-gradient(90deg, #555, #555 10px, #aaa 10px, #aaa 20px);
    border-top: 4px solid #333;
    border-bottom: 4px solid #333;
    border-radius: 4px;
  }
  .train { 
    position: absolute; 
    bottom: 22px; 
    left: 2%; 
    font-size: 55px;
    line-height: 1;
    transition: left 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15));
  }

  /* Responsive Cards Area Layout */
  .question-card { 
    max-width: 850px; 
    width: 100%;
    margin: 5px auto 20px auto; 
    background: rgba(255, 255, 255, 0.96); 
    border-radius: 28px; 
    padding: 20px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    border: 5px solid #ffbf00;
    z-index: 10;
  }
  .qno { font-size: 16px; color: #666; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
  .question { font-size: clamp(20px, 4.5vw, 30px); font-weight: bold; margin: 12px 0; color: #174ea6; }
  
  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 15px; }
  @media(max-width: 500px) { .options { grid-template-columns: 1fr; } }
  
  .option { 
    background: #fff; 
    border: 4px solid #74b9ff; 
    border-radius: 20px; 
    padding: 15px; 
    font-size: 26px; 
    font-weight: bold; 
    cursor: pointer; 
    min-height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 #74b9ff;
    transition: all 0.1s ease;
  }
  .option:hover { background: #eaf6ff; transform: translateY(-2px); }
  .option:active { transform: translateY(2px); box-shadow: 0 1px 0 #74b9ff; }
  .option.disabled { pointer-events: none; opacity: 0.6; }
  
  .feedback { 
    min-height: 40px; 
    font-size: 22px; 
    font-weight: bold; 
    margin-top: 12px; 
  }
  .correct-msg { color: #188038; animation: bounce 0.4s ease; }
