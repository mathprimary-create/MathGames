<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape & Pattern Champions</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #2b5876, #4e4376);
    color: white;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    transition: background 0.5s ease;
}

/* 5-SECOND SPLASH SCREEN */
#splashScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    transition: opacity 0.5s ease-out;
}

#splashScreen img {
    max-width: 80%;
    max-height: 60%;
    object-fit: contain;
}

/* MAIN GAME RUNTIME CONTAINER */
#gameContainer {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

/* LEVEL BADGE INFOBAR */
.level-badge {
    background: rgba(0, 0, 0, 0.4);
    padding: 6px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 15px;
    border: 1px solid rgba(255,255,255,0.2);
}

h1 {
    margin: 10px 0 5px 0;
    font-size: clamp(24px, 6vw, 38px);
    text-shadow: 0px 4px 8px rgba(0,0,0,0.4);
    color: #ffd166;
}

.description {
    margin: 0 0 5px 0;
    font-size: clamp(14px, 3.2vw, 18px);
    opacity: 0.9;
    max-width: 90%;
}

.instruction {
    margin: 0 0 15px 0;
    font-size: clamp(15px, 3.5vw, 19px);
    color: #a8ffb2;
    font-weight: bold;
    text-shadow: 0px 2px 4px rgba(0,0,0,0.3);
}

/* LEVEL 1: SHAPES MATCHING GRID (4 cols x 3 rows) */
.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    justify-content: center;
    margin: 5px auto;
    padding: 15px;
    width: 92vw;
    max-width: 540px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

@media(min-width: 440px) {
    .board { grid-template-columns: repeat(4, 1fr); }
}

/* CARD LAYOUTS & CLARITY FIX FOR TINY ASSETS */
.card {
    width: 100%;
    aspect-ratio: 1 / 1;
    min-width: 85px;
    min-height: 85px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
    user-select: none;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    padding: 6px;
    box-sizing: border-box;
}

.card-img {
    width: 95%;
    height: 95%;
    object-fit: contain;
    pointer-events: none;
    transform: scale(1.15); /* Maximizes asset presentation sizes cleanly */
}

.card-text {
    font-size: clamp(10px, 2.2vw, 12px);
    margin-top: 2px;
    text-align: center;
    color: #fff;
    text-shadow: 0 1px 2px #000;
}

.normal {
    background: linear-gradient(135deg, #ffb703, #fb8500);
    border: 3px solid #fff;
}

.card-back-icon {
    width: 85%;
    height: 85%;
    object-fit: contain;
    transform: scale(1.1);
}

.flipped {
    background: linear-gradient(135deg, #ffffff, #e0f2f1);
    border: 3px solid #219ebc;
}

.flipped .card-text { color: #023e8a; text-shadow: none; font-weight: 800; }

.matched {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    border: 3px solid #06d6a0;
    cursor: default;
    box-shadow: 0 0 15px rgba(6, 214, 160, 0.6);
    transform: scale(0.98);
}

.matched .card-text { color: #1b5e20; text-shadow: none; font-weight: 800; }


/* LEVEL 2: PATTERNS SYSTEM VISUAL ARENAS */
#patternsArena {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.pattern-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.15);
    padding: 20px;
    border-radius: 20px;
    width: 90vw;
    max-width: 540px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    margin-bottom: 25px;
}

.pattern-tile {
    width: clamp(55px, 12vw, 75px);
    aspect-ratio: 1 / 1;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    padding: 5px;
    box-sizing: border-box;
}

.pattern-tile img { width: 100%; height: 100%; object-fit: contain; }

.blank-tile {
    border: 3px dashed #fffb00;
    background: rgba(0, 0, 0, 0.2);
    color: #fffb00;
    font-size: clamp(24px, 6vw, 36px);
    font-weight: bold;
    animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); opacity: 0.8; }
    to { transform: scale(1.05); opacity: 1; }
}

.options-grid {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    width: 90vw;
    max-width: 540px;
}

.option-btn {
    width: clamp(70px, 16vw, 95px);
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border: 4px solid #fff;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    transition: transform 0.2s, background-color 0.2s;
    padding: 8px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
}

.option-btn img { width: 100%; height: 100%; object-fit: contain; }
.option-btn:hover { transform: scale(1.08); }


/* CORE INTERACTION CONTROLS */
.btn {
    padding: 14px 35px;
    margin: 15px 0;
    font-size: 18px;
    font-weight: bold;
    border: 2px solid #fff;
    border-radius: 50px;
    cursor: pointer;
    background: #023e8a;
    color: white;
    box-shadow: 0 4px 15px rgba(2, 62, 138, 0.6);
    transition: transform 0.1s, opacity 0.3s;
}

.btn:hover:not(:disabled) { transform: scale(1.05); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* CELEBRATIONS & INTERFACES */
#fireworks {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
}

#winScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(20, 15, 35, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

#winScreen h1 {
    font-size: clamp(36px, 8vw, 64px);
    color: #ffd166;
    margin: 0 0 10px 0;
    animation: pop 0.6s ease-in-out infinite alternate;
}

@keyframes pop { from { transform: scale(1); } to { transform: scale(1.06); } }
</style>
</head>

<body>

<div id="splashScreen">
    <img src="assets/logo.png" alt="Logo">
</div>

<div id="gameContainer">
    <div id="levelBadge" class="level-badge">LEVEL 1</div>
    <h1 id="mainTitle">👑 Shape Champions</h1>
    <p id="mainDesc" class="description">Become a geometry master by linking matching pairs!</p>
    <p id="mainInstr" class="instruction">👉 Click the tiles to match the shapes to the objects.</p>

    <div id="shapesBoard" class="board"></div>

    <div id="patternsArena">
        <div id="patternBoard" class="pattern-container"></div>
        <div id="optionsContainer" class="options-grid"></div>
    </div>

    <button id="actionBtn" class="btn" onclick="handleActionBtnClick()">Restart Level</button>
</div>

<canvas id="fireworks"></canvas>

<div id="winScreen">
    <h1 id="winTitle">LEVEL CLEAR! 🎉</h1>
    <p id="winDesc" style="font-size: 20px; margin-bottom:25px;">Outstanding! You did an amazing job!</p>
    <button id="winResetBtn" class="btn" style="background:#ff006e; box-shadow: 0 4px 15px rgba(255,0,110,0.6);" onclick="handleWinScreenReset()">Next Level ➡️</button>
</div>

<audio id="winMusic" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0b6b6b5c3.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<audio id="correctSound" preload="auto" src="assets/correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="assets/wrong.mp3"></audio>

<script>
const winMusic = document.getElementById("winMusic");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

[winMusic, correctSound, wrongSound].forEach(track => { track.volume = 0.5; });

let currentLevel = 1; // Tracks current gameplay layer index
let winTimerInterval = null;

/* LEVEL 1 DEFINITIONS ARRAY */
const shapesPool = [
    { id: 1, imgFile: "assets/circle.png", text: "Circle" },
    { id: 1, imgFile: "assets/coin.png", text: "Coin" },
    { id: 2, imgFile: "assets/triangle.png", text: "Triangle" },
    { id: 2, imgFile: "assets/pizza-slice.png", text: "Pizza" },
    { id: 3, imgFile: "assets/square.png", text: "Square" },
    { id: 3, imgFile: "assets/window.png", text: "Window" },
    { id: 4, imgFile: "assets/sphere.png", text: "Sphere" },
    { id: 4, imgFile: "assets/ball.png", text: "Ball" },
    { id: 5, imgFile: "assets/cone.png", text: "Cone" },
    { id: 5, imgFile: "assets/party-hat.png", text: "Party Hat" },
    { id: 6, imgFile: "assets/cube.png", text: "Cube" },
    { id: 6, imgFile: "assets/dice.png", text: "Dice" }
];

/* LEVEL 2 DEFINITIONS ARRAY */
const patternsPool = [
    {
        sequence: ["assets/circle.png", "assets/triangle.png", "assets/circle.png", "assets/triangle.png", "assets/circle.png"],
        correctAnswer: "assets/triangle.png",
        options: ["assets/triangle.png", "assets/square.png", "assets/pizza-slice.png"]
    },
    {
        sequence: ["assets/stars.png", "assets/clouds.png", "assets/stars.png", "assets/clouds.png", "assets/stars.png"],
        correctAnswer: "assets/clouds.png",
        options: ["assets/circle.png", "assets/clouds.png", "assets/ball.png"]
    },
    {
        sequence: ["assets/cube.png", "assets/sphere.png", "assets/cube.png", "assets/sphere.png", "assets/cube.png"],
        correctAnswer: "assets/sphere.png",
        options: ["assets/sphere.png", "assets/dice.png", "assets/cone.png"]
    },
    {
        sequence: ["assets/pizza-slice.png", "assets/coin.png", "assets/pizza-slice.png", "assets/coin.png", "assets/pizza-slice.png"],
        correctAnswer: "assets/coin.png",
        options: ["assets/window.png", "assets/triangle.png", "assets/coin.png"]
    },
    {
        sequence: ["assets/square.png", "assets/rectangle.png", "assets/triangle.png", "assets/square.png", "assets/rectangle.png"],
        correctAnswer: "assets/triangle.png",
        options: ["assets/circle.png", "assets/triangle.png", "assets/square.png"]
    }
];

// Level 1 Variable Context State
let cards = []; let flipped = []; let matched = []; let lock = false;

// Level 2 Variable Context State
let currentPatternIndex = 0; let patternAnswerSelected = false;

// Auto-dismiss initialization screen handler
window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const splash = document.getElementById("splashScreen");
        const gameUI = document.getElementById("gameContainer");
        splash.style.opacity = "0";
        setTimeout(() => {
            splash.style.display = "none";
            gameUI.style.display = "flex";
            initLevel1();
        }, 500);
    }, 5000); 
});

/* CORE ROUTING CONTROL LOGIC */
function handleActionBtnClick() {
    if (currentLevel === 1) {
        initLevel1();
    } else {
        if (patternAnswerSelected) {
            loadNextPattern();
        }
    }
}

function handleWinScreenReset() {
    document.getElementById("winScreen").style.display = "none";
    if (winTimerInterval) clearInterval(winTimerInterval);
    particles = [];

    if (currentLevel === 1) {
        // Elevate user into Level 2 context
        currentLevel = 2;
        initLevel2();
    } else {
        // Loop back directly to Level 1
        currentLevel = 1;
        initLevel1();
    }
}

/* ================= LEVEL 1: ENGINE OPERATORS ================= */
function initLevel1() {
    document.body.style.background = "linear-gradient(135deg, #2b5876, #4e4376)";
    document.getElementById("levelBadge").innerText = "LEVEL 1";
    document.getElementById("mainTitle").innerText = "👑 Shape Champions";
    document.getElementById("mainDesc").innerText = "Become a geometry master by linking matching pairs!";
    document.getElementById("mainInstr").innerText = "👉 Click the tiles to match the shapes to the objects.";
    
    document.getElementById("shapesBoard").style.display = "grid";
    document.getElementById("patternsArena").style.display = "none";
    
    const actionBtn = document.getElementById("actionBtn");
    actionBtn.innerText = "Restart Level";
    actionBtn.disabled = false;

    flipped = []; matched = []; lock = false;
    cards = JSON.parse(JSON.stringify(shapesPool));
    
    // Shuffle level elements
    for(let i = cards.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    renderShapesBoard();
}

function renderShapesBoard() {
    let board = document.getElementById("shapesBoard");
    board.innerHTML = "";

    cards.forEach((c, i)=>{
        let div = document.createElement("div");
        let isMatched = matched.includes(i);
        let isFlipped = flipped.includes(i);

        if(isMatched){
            div.className = "card matched";
            div.innerHTML = `<img class="card-img" src="${c.imgFile}" alt="${c.text}"><div class="card-text">${c.text}</div>`;
        } else if(isFlipped){
            div.className = "card flipped";
            div.innerHTML = `<img class="card-img" src="${c.imgFile}" alt="${c.text}"><div class="card-text">${c.text}</div>`;
        } else {
            div.className = "card normal";
            div.innerHTML = `<img class="card-back-icon" src="assets/shape-machine.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                             <div style="display:none; font-size:32px;">❓</div>`;
        }
        div.onclick = () => flipCard(i);
        board.appendChild(div);
    });
}

function flipCard(i){
    if(lock) return;
    if(flipped.includes(i) || matched.includes(i)) return;

    flipped.push(i);
    renderShapesBoard();

    if(flipped.length === 2){
        lock = true;
        let i1 = flipped[0]; let i2 = flipped[1];

        if(cards[i1].id === cards[i2].id && i1 !== i2){
            matched.push(i1, i2);
            correctSound.currentTime = 0;
            correctSound.play().catch(e => {});

            setTimeout(() => {
                flipped = []; lock = false;
                renderShapesBoard();
                if(matched.length === cards.length) triggerLevelClearWindow("LEVEL 1 CLEAR! 🎉", "Superb work! Ready for the patterns challenge?", "Next Level ➡️");
            }, 500);
        } else {
            wrongSound.currentTime = 0;
            wrongSound.play().catch(e => {});

            setTimeout(() => {
                flipped = []; lock = false;
                renderShapesBoard();
            }, 900);
        }
    }
}

/* ================= LEVEL 2: ENGINE OPERATORS ================= */
function initLevel2() {
    document.body.style.background = "linear-gradient(135deg, #11998e, #38ef7d)"; // Transition layout theme hue automatically
    document.getElementById("levelBadge").innerText = "LEVEL 2";
    document.getElementById("mainTitle").innerText = "✨ Pattern Wizards";
    document.getElementById("mainDesc").innerText = "Look closely at the repeating items!";
    document.getElementById("mainInstr").innerText = "👉 Which image fills the missing spot?";
    
    document.getElementById("shapesBoard").style.display = "none";
    document.getElementById("patternsArena").style.display = "flex";
    
    currentPatternIndex = 0;
    loadPatternSequence(currentPatternIndex);
}

function loadPatternSequence(index) {
    patternAnswerSelected = false;
    
    const actionBtn = document.getElementById("actionBtn");
    actionBtn.innerText = "Next Pattern ➡️";
    actionBtn.disabled = true;

    const currentPattern = patternsPool[index];
    const board = document.getElementById("patternBoard");
    board.innerHTML = "";

    currentPattern.sequence.forEach(imgSrc => {
        const tile = document.createElement("div");
        tile.className = "pattern-tile";
        tile.innerHTML = `<img src="${imgSrc}">`;
        board.appendChild(tile);
    });

    const missingSlot = document.createElement("div");
    missingSlot.className = "pattern-tile blank-tile";
    missingSlot.id = "targetBlank";
    missingSlot.innerText = "?";
    board.appendChild(missingSlot);

    const optionsBox = document.getElementById("optionsContainer");
    optionsBox.innerHTML = "";
    
    currentPattern.options.forEach(optionSrc => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<img src="${optionSrc}">`;
        btn.onclick = () => verifyPatternChoice(btn, optionSrc, currentPattern.correctAnswer);
        optionsBox.appendChild(btn);
    });
}

function verifyPatternChoice(btnElement, chosenSrc, correctSrc) {
    if (patternAnswerSelected) return;

    if (chosenSrc === correctSrc) {
        patternAnswerSelected = true;
        correctSound.currentTime = 0;
        correctSound.play().catch(e => {});

        const blank = document.getElementById("targetBlank");
        blank.className = "pattern-tile";
        blank.style.animation = "none";
        blank.innerHTML = `<img src="${chosenSrc}">`;
        
        btnElement.style.backgroundColor = "#c8e6c9";
        btnElement.style.borderColor = "#06d6a0";

        document.getElementById("actionBtn").disabled = false;
    } else {
        wrongSound.currentTime = 0;
        wrongSound.play().catch(e => {});
        
        btnElement.style.backgroundColor = "#ffcdd2";
        btnElement.style.borderColor = "#ff1744";
        setTimeout(() => {
            btnElement.style.backgroundColor = "#ffffff";
            btnElement.style.borderColor = "#ffffff";
        }, 600);
    }
}

function loadNextPattern() {
    currentPatternIndex++;
    if (currentPatternIndex < patternsPool.length) {
        loadPatternSequence(currentPatternIndex);
    } else {
        triggerLevelClearWindow("GRAND CHAMPION! 🏆", "Incredible job! You mastered both Levels perfectly!", "Play Again 🔄");
    }
}

/* ================= OVERLAY WINDOW HANDLING ================= */
function triggerLevelClearWindow(title, desc, buttonText) {
    document.getElementById("winTitle").innerText = title;
    document.getElementById("winDesc").innerText = desc;
    document.getElementById("winResetBtn").innerText = buttonText;
    document.getElementById("winScreen").style.display = "flex";
    
    winMusic.currentTime = 0;
    winMusic.play().catch(e => {});

    burstFireworks();
    winTimerInterval = setInterval(burstFireworks, 700);
}

// VECTOR FIREWORKS RENDERING SYSTEM
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];

function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

function burstFireworks(){
    const originX = Math.random() * canvas.width;
    const originY = Math.random() * (canvas.height * 0.6) + (canvas.height * 0.1);
    const hue = Math.floor(Math.random() * 360);
    const colorString = `hsla(${hue}, 100%, 60%, `;

    for(let i = 0; i < 35; i++){
        let angle = Math.random() * 2 * Math.PI;
        let speed = Math.random() * 4 + 1.5;
        particles.push({
            x: originX, y: originY,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            radius: Math.random() * 2 + 1, alpha: 1,
            color: colorString, gravity: 0.04
        });
    }
}

function animate(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.alpha -= 0.015; });
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => {
        ctx.fillStyle = `${p.color}${p.alpha})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
