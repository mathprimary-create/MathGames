<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova's Space Rescue – Addition up to 9999</title>
<style>
body {
    margin: 0;
    font-family: 'Arbutus', cursive;
    overflow: hidden;
}
#splash, #game, #endScreen {
    width: 100%;
    height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#splash img { width: 200px; height: auto; }
#overlay {
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.35);
    z-index:1;
}
h1,h2,#questionBox,#scoreBoard,#levelDisplay,#crystalMeter {
    z-index:2;
    position: relative;
    text-align: center;
    color: #ffffff;
    text-shadow: 2px 2px 5px #000000;
}
#questionBox { font-size: 1.8em; margin:10px; }
#aliens {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
    position: relative;
    z-index:2;
}
.alien {
    width: 120px;
    height: 120px;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.3s;
}
.alien:hover { transform: scale(1.1);}
.wiggle { animation: wiggle 0.5s; }
@keyframes wiggle {0% {transform: rotate(0deg);} 25% {transform: rotate(15deg);} 50% {transform: rotate(-15deg);} 75% {transform: rotate(10deg);} 100% {transform: rotate(0deg);}}
#playAgainBtn { padding: 10px 20px; font-size: 1.5em; background-color: #4b2e83; color:white; border:none; border-radius:10px; cursor:pointer; margin-top:20px;}
#playAgainBtn:hover {background-color:#6a4cb0;}
</style>
</head>
<body>

<div id="splash">
    <img src="assets/logo.png" alt="Innovine Logo">
</div>

<div id="game">
    <div id="overlay"></div>
    <h2 id="levelDisplay">Level 1 – Moon Valley</h2>
    <div id="scoreBoard">Score: 0</div>
    <div id="crystalMeter">Crystals: <span>⚪⚪⚪</span></div>
    <div id="questionBox">Question Here</div>
    <div id="aliens"></div>
</div>

<div id="endScreen">
    <h1>Mission Complete!</h1>
    <h2>Well Done, Nova reached Earth!</h2>
    <button id="playAgainBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// Questions
const questions=[
  {q:"4578 + 622 = ?", options:[5198,5200,5190,5202], answer:5198},
  {q:"3200 + 178 = ?", options:[3378,3380,3385,3365], answer:3378},
  {q:"4444 + 555 = ?", options:[4999,5000,4998,5001], answer:4999},
  {q:"3000 + 678 = ?", options:[3678,3680,3670,3668], answer:3678},
  {q:"1500 + 799 = ?", options:[2299,2298,2297,2300], answer:2299},
  
  {q:"2345 + 765 = ?", options:[3110,3111,3112,3100], answer:3110},
  {q:"4000 + 1234 = ?", options:[5234,5230,5235,5240], answer:5234},
  {q:"678 + 321 = ?", options:[999,1000,1001,998], answer:999},
  {q:"2000 + 1500 = ?", options:[3500,3490,3505,3510], answer:3500},
  {q:"4999 + 1 = ?", options:[5000,5001,4998,4999], answer:5000},
  
  {q:"4500 + 499 = ?", options:[4999,5000,4998,5001], answer:4999},
  {q:"6200 + 780 = ?", options:[6980,6985,6990,6975], answer:6980},
  {q:"3456 + 1234 = ?", options:[4690,4690,4690,4690], answer:4690},
  {q:"7000 + 299 = ?", options:[7299,7300,7298,7289], answer:7299},
  {q:"888 + 1111 = ?", options:[1999,1998,2000,1997], answer:1999}
];

let currentQuestion=0,score=0;
const splash=document.getElementById("splash");
const game=document.getElementById("game");
const endScreen=document.getElementById("endScreen");
const questionBox=document.getElementById("questionBox");
const aliensDiv=document.getElementById("aliens");
const scoreBoard=document.getElementById("scoreBoard");
const levelDisplay=document.getElementById("levelDisplay");
const crystalMeter=document.getElementById("crystalMeter");
const playAgainBtn=document.getElementById("playAgainBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const levelBackgrounds=["assets/moon-bg.png","assets/asteroid-bg.png","assets/background-galaxy.png"];
const alienImages=["assets/alien1.png","assets/alien2.png","assets/alien3.png","assets/alien4.png"];

splash.style.display="flex";
setTimeout(()=>{splash.style.display="none"; game.style.display="flex"; showQuestion();},2500);

function showQuestion(){
  if(currentQuestion>=questions.length){ endGame(); return;}
  const q=questions[currentQuestion];
  questionBox.textContent=q.q;
  
  // Level & background
  let levelIndex=Math.floor(currentQuestion/5);
  levelDisplay.textContent=["Level 1 – Moon Valley","Level 2 – Asteroid Belt","Level 3 – Galaxy Gate"][levelIndex];
  document.body.style.background=`url(${levelBackgrounds[levelIndex]}) center/cover no-repeat`;
  
  // Crystal meter
  let crystalsFilled=currentQuestion%5;
  let crystalStr="";
  for(let i=0;i<5;i++) crystalStr+=i<crystalsFilled?"🔷":"⚪";
  crystalMeter.innerHTML="Crystals: "+crystalStr;
  
  // Show aliens with floating animation
  aliensDiv.innerHTML="";
  q.options.forEach((option,index)=>{
    const div=document.createElement("img");
    div.src=alienImages[index];
    div.classList.add("alien");
    div.width=100; div.height=100; div.alt=option;
    let dir=Math.random()<0.5?1:-1;
    let left=Math.random()*200+50;
    div.style.position="absolute"; div.style.left=left+"px"; div.style.top="0px";
    aliensDiv.appendChild(div);

    let floatInterval=setInterval(()=>{
      let curLeft=parseFloat(div.style.left);
      if(curLeft>window.innerWidth-120||curLeft<10) dir*=-1;
      div.style.left=(curLeft+dir*1.5)+"px";
      div.style.top=(parseFloat(div.style.top)+0.5)+"px";
      if(parseFloat(div.style.top)>window.innerHeight-150) clearInterval(floatInterval);
    },20);

    div.addEventListener("click",()=>{
      if(option===q.answer){
        correctSound.currentTime=0; correctSound.play();
        score+=10; scoreBoard.textContent="Score: "+score;
        currentQuestion++;
        setTimeout(showQuestion,500);
        clearInterval(floatInterval);
      } else {
        wrongSound.currentTime=0; wrongSound.play();
        div.classList.add("wiggle");
        setTimeout(()=>div.classList.remove("wiggle"),500);
      }
    });
  });
}

function endGame(){
  game.style.display="none"; endScreen.style.display="flex";
  document.getElementById("clapSound")?.play();
}

playAgainBtn.addEventListener("click",()=>{
  currentQuestion=0; score=0; scoreBoard.textContent="Score: 0";
  endScreen.style.display="none"; game.style.display="flex"; showQuestion();
});
</script>
</body>
</html>
