<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living vs Non-Living Things Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a8ff78, #78ffd6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .progress-bar {
            background: #eee;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            background: #2ecc71;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            background: #f8f9fa;
            border: 3px dashed #bdc3c7;
            border-radius: 15px;
            padding: 30px 15px;
            margin-bottom: 25px;
        }

        .word-to-sort {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .hint {
            font-size: 14px;
            color: #95a5a6;
            font-style: italic;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 5px 0 #2980b9;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #2980b9;
        }

        .btn-living { background: #2ecc71; box-shadow: 0 5px 0 #27ae60; }
        .btn-living:active { box-shadow: 0 1px 0 #27ae60; }

        .btn-nonliving { background: #e67e22; box-shadow: 0 5px 0 #d35400; }
        .btn-nonliving:active { box-shadow: 0 1px 0 #d35400; }

        .feedback {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            height: 25px;
        }

        .score-screen {
            display: none;
        }

        .final-score {
            font-size: 48px;
            color: #2ecc71;
            font-weight: bold;
            margin: 20px 0;
        }

        .btn-restart {
            background: #9b59b6;
            box-shadow: 0 5px 0 #8e44ad;
            width: 100%;
            margin-top: 15px;
        }
        .btn-restart:active { box-shadow: 0 1px 0 #8e44ad; }

        /* Audio Controls Box */
        .volume-control {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 12px;
            color: #7f8c8d;
        }

        /* Simple Pure CSS Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f1c40f;
            top: -10px;
            border-radius: 50%;
            animation: fall 1s linear infinite;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="quiz-screen">
            <h1>Living vs Non-Living</h1>
            <div class="subtitle">Grade 3 EVS Practice Game</div>
            
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

            <div class="question-card">
                <div class="word-to-sort" id="item-text">...</div>
                <div class="hint">Is this item alive or not alive?</div>
            </div>

            <div class="options-container">
                <button class="btn btn-living" onclick="checkAnswer('Living')">🌿 Living Thing</button>
                <button class="btn btn-nonliving" onclick="checkAnswer('Non-Living')">🚗 Non-Living Thing</button>
            </div>

            <div class="feedback" id="feedback-text"></div>
        </div>

        <div class="score-screen" id="score-screen">
            <h1>Game Complete! 🎉</h1>
            <p>You did a wonderful job balancing nature!</p>
            <div class="final-score" id="final-score-text">0 / 10</div>
            <button class="btn btn-restart" onclick="restartGame()">Play Again 🔄</button>
        </div>

        <div class="volume-control">
            🔊 Sound Level: <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
        </div>
    </div>

    <script>
        // Game items dataset (10 items as required)
        const allItems = [
            { name: "Puppy 🐶", type: "Living" },
            { name: "Bicycle 🚲", type: "Non-Living" },
            { name: "Mango Tree 🌳", type: "Living" },
            { name: "Stone 🪨", type: "Non-Living" },
            { name: "Butterfly 🦋", type: "Living" },
            { name: "Water Bottle 🧪", type: "Non-Living" },
            { name: "Bird 🐦", type: "Living" },
            { name: "Book 📘", type: "Non-Living" },
            { name: "Mushroom 🍄", type: "Living" },
            { name: "Computer 💻", type: "Non-Living" }
        ];

        let gameItems = [];
        let currentIndex = 0;
        let score = 0;
        let canAnswer = true;

        // Sound Generator Synth (Web Audio API) - No external audio files needed!
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(isCorrect) {
            const volumeLevel = document.getElementById('volume-slider').value;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(volumeLevel, audioCtx.currentTime);

            if (isCorrect) {
                // Happy high chime
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                // Sad low buzz
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        // CSS Confetti Generator
        function triggerConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = ['#f1c40f','#e74c3c','#3498db','#9b59b6','#2ecc71'][Math.floor(Math.random()*5)];
                confetti.style.transform = `scale(${Math.random() * 1 + 0.5})`;
                confetti.style.animationDuration = Math.random() * 1 + 0.5 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 1500);
            }
        }

        // Shuffle questions array randomly
        function shuffleQuestions() {
            gameItems = [...allItems].sort(() => Math.random() - 0.5);
        }

        function loadQuestion() {
            if (currentIndex < gameItems.length) {
                canAnswer = true;
                document.getElementById('feedback-text').innerText = "";
                document.getElementById('item-text').innerText = gameItems[currentIndex].name;
                
                // Update Progress Bar
                const progPercent = (currentIndex / gameItems.length) * 100;
                document.getElementById('progress').style.width = progPercent + "%";
            } else {
                showResults();
            }
        }

        function checkAnswer(selectedType) {
            if (!canAnswer) return;
            canAnswer = false;

            const correctAnswer = gameItems[currentIndex].type;
            const feedbackEl = document.getElementById('feedback-text');

            if (selectedType === correctAnswer) {
                score++;
                feedbackEl.style.color = "#2ecc71";
                feedbackEl.innerText = "Correct! ✨";
                playSound(true);
                triggerConfetti();
            } else {
                feedbackEl.style.color = "#e74c3c";
                feedbackEl.innerText = "Oops! Try another next time.";
                playSound(false);
            }

            // Move to next question automatically after 1.2 seconds
            currentIndex++;
            setTimeout(loadQuestion, 1200);
        }

        function showResults() {
            document.getElementById('progress').style.width = "100%";
            document.getElementById('quiz-screen').style.display = "none";
            document.getElementById('score-screen').style.display = "block";
            document.getElementById('final-score-text').innerText = `${score} / ${gameItems.length}`;
        }

        function restartGame() {
            score = 0;
            currentIndex = 0;
            document.getElementById('quiz-screen').style.display = "block";
            document.getElementById('score-screen').style.display = "none";
            shuffleQuestions();
            loadQuestion();
        }

        // Initialize game on load
        window.onload = () => {
            shuffleQuestions();
            loadQuestion();
        };
    </script>
</body>
</html>
