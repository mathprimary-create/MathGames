<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova's Space Rescue – Addition up to 9999</title>
<style>
body {
  margin: 0;
  font-family: 'Arbutus', cursive;
  overflow: hidden;
}
#splash, #game, #endScreen {
  width: 100%;
  height: 100vh;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#splash img { width: 200px; height: auto; }
#overlay {
  position: absolute;
  top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.35);
  z-index:1;
}
h1,h2,#questionBox,#scoreBoard,#levelDisplay,#crystalMeter {
  z-index:2;
  position: relative;
  color: #ffffff;
  text-shadow: 2px 2px 5px #000000;
  text-align: center;
}
#questionBox { font-size: 2em; margin:10px; }
#aliens {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  position: relative;
  z-index:2;
}
.alien {
  width: 120px;
  height: 120px;
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: transform 0.3s;
}
.alien:hover { transform: scale(1.1);}
.alien-number {
  position: absolute;
  bottom: 5px;
  width: 100%;
  text-align: center;
  font-size: 1.2em;
  color: #ffffff;
  text-shadow: 2px 2px 5px #000000;
  z-index:3;
}
.wiggle { animation: wiggle 0.5s; }
@keyframes wiggle {0% {transform: rotate(0deg);} 25% {transform: rotate(15deg);} 50% {transform: rotate(-15deg);} 75% {transform: rotate(10deg);} 100% {transform: rotate(0deg);}}
