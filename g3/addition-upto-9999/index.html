<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3: Multiplication Matrix</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            --success: #10b981;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #fed7aa 0%, #bae6fd 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', sans-serif; }
        body { overflow: hidden; background: var(--bg-gradient); height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #splashOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s, visibility 0.6s; }
        .logo-box { animation: breatheLogo 2.5s ease-in-out infinite alternate; }
        @keyframes breatheLogo { 0% { transform: scale(0.96); } 100% { transform: scale(1.04); } }
        .innovine-logo-img { width: 350px; height: auto; }
        .splash-loader-track { width: 200px; height: 8px; background: #e2e8f0; border-radius: 10px; margin-top: 30px; overflow: hidden; }
        .splash-loader-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #de1f26, #1f2c3f); animation: fillLoader 5s linear forwards; }
        @keyframes fillLoader { 0% { width: 0%; } 100% { width: 100%; } }

        .game-card { width: 92%; max-width: 600px; background: white; padding: 30px 20px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center; border: 6px solid #0284c7; opacity: 0; transform: scale(0.9); transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .game-card.reveal-app { opacity: 1; transform: scale(1); }
        .status-hub { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .pill { background: #f3f4f6; padding: 8px 16px; border-radius: 50px; font-weight: bold; }
        
        .question-box { font-size: 52px; font-weight: bold; color: #0c4a6e; margin: 25px 0; background: #f0f9ff; border-radius: 16px; padding: 15px; border: 3px solid #7dd3fc; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .option-card { background: white; padding: 18px; border-radius: 16px; font-size: 24px; font-weight: bold; cursor: pointer; transition: all 0.2s; border: 4px solid #e5e7eb; box-shadow: 0 6px 0 #d1d5db; }
        .option-card:hover { transform: translateY(-3px); border-color: #38bdf8; box-shadow: 0 9px 0 #0284c7; background: #f0f9ff; }
        
        .feedback-message { font-size: 20px; font-weight: bold; min-height: 35px; margin-top: 20px; }
        .msg-correct { color: var(--success); }
        .msg-wrong { color: var(--danger); }
        .screen-workspace { display: block; }
        .screen-final { display: none; }
    </style>
</head>
<body>

    <div id="splashOverlay">
        <div class="logo-box"><img src="logo.png" class="innovine-logo-img" alt="Logo"></div>
        <div class="splash-loader-track"><div class="splash-loader-bar"></div></div>
    </div>

    <div class="game-card" id="appMainCard">
        <header>
            <h1>⚡ Multiplication Masters</h1>
            <p style="color:#6b7280; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Grade 3 Math Quest</p>
        </header>

        <div id="gameWorkspace" class="screen-workspace">
            <div class="status-hub">
                <div class="pill">🏅 Quest: <span id="roundNum">1</span>/10</div>
                <div>🔊 <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.7"></div>
                <div class="pill">⭐ Score: <span id="scoreDisplay">0</span></div>
            </div>

            <p style="font-size: 18px; font-weight: bold; color: #4b5563;">Solve the multiplication puzzle:</p>
            <div class="question-box" id="qBox">5 × 4 = ?</div>

            <div class="options-grid" id="optionsBox"></div>
            <div class="feedback-message" id="feedbackBox"></div>
        </div>

        <div id="finalDashboard" class="screen-final">
            <h2 style="font-size:32px; color:#0284c7; margin-bottom:15px;">👑 Arena Mastered! 👑</h2>
            <div style="font-size:22px; font-weight:bold; margin-bottom:20px;">Final Accuracy: <span id="finalScore" style="color:var(--success);">0/10</span></div>
            <button style="padding:12px 30px; font-size:18px; font-weight:bold; background:var(--success); color:white; border:none; border-radius:12px; cursor:pointer;" onclick="resetEngine()">Play Again 🔄</button>
        </div>
    </div>

    <audio id="sndCorrect" src="correct.mp3"></audio>
    <audio id="sndWrong" src="wrong.mp3"></audio>

    <script>
        let currentRound = 1;
        let scoreCount = 0;
        let solutionValue = 0;
        let acceptingInput = true;

        function generateQuestion() {
            acceptingInput = true;
            document.getElementById('feedbackBox').innerText = '';
            document.getElementById('roundNum').innerText = currentRound;
            document.getElementById('scoreDisplay').innerText = scoreCount * 10;

            let factorA = Math.floor(Math.random() * 10) + 1;
            let factorB = Math.floor(Math.random() * 10) + 1;
            solutionValue = factorA * factorB;

            document.getElementById('qBox').innerText = `${factorA} × ${factorB} = ?`;

            // Core algorithmic option distractors generation
            let choices = [solutionValue];
            while (choices.length < 4) {
                let dev = solutionValue + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1);
                if (dev > 0 && !choices.includes(dev)) choices.push(dev);
            }
            choices.sort(() => Math.random() - 0.5);

            const container = document.getElementById('optionsBox');
            container.innerHTML = '';
            choices.forEach(val => {
                const btn = document.createElement('div');
                btn.className = 'option-card';
                btn.innerText = val;
                btn.onclick = () => checkAnswer(val, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, element) {
            if (!acceptingInput) return;
            acceptingInput = false;

            const sndC = document.getElementById('sndCorrect');
            const sndW = document.getElementById('sndWrong');
            sndC.volume = sndW.volume = document.getElementById('volSlider').value;

            if (selected === solutionValue) {
                element.style.borderColor = 'var(--success)';
                document.getElementById('feedbackBox').innerText = '🎉 Excellent Multiplier!';
                document.getElementById('feedbackBox').className = 'feedback-message msg-correct';
                sndC.play();
                scoreCount++;
                confetti({ particleCount: 70, spread: 60 });
            } else {
                element.style.borderColor = 'var(--danger)';
                document.getElementById('feedbackBox').innerText = `Incorrect. The product is ${solutionValue}`;
                document.getElementById('feedbackBox').className = 'feedback-message msg-wrong';
                sndW.play();
            }

            setTimeout(() => {
                currentRound++;
                if (currentRound <= 10) generateQuestion();
                else showScoreboard();
            }, 1800);
        }

        function showScoreboard() {
            document.getElementById('gameWorkspace').style.display = 'none';
            document.getElementById('finalDashboard').style.display = 'block';
            document.getElementById('finalScore').innerText = `${scoreCount} / 10`;
            confetti({ particleCount: 140, spread: 80 });
        }

        function resetEngine() {
            currentRound = 1; scoreCount = 0;
            document.getElementById('gameWorkspace').style.display = 'block';
            document.getElementById('finalDashboard').style.display = 'none';
            generateQuestion();
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splashOverlay').style.opacity = '0';
                document.getElementById('splashOverlay').style.visibility = 'hidden';
                document.getElementById('appMainCard').classList.add('reveal-app');
                generateQuestion();
            }, 5000);
        });
    </script>
</body>
</html>
