<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addition Game</title>

<style>
body{
font-family:"Comic Sans MS", Arial;
background:linear-gradient(135deg,#ffeaa7,#81ecec);
text-align:center;
margin:0;
}
.game{
max-width:650px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
margin-top:20px;
}
.problem{font-size:42px;margin:20px;}
button{
font-size:20px;
padding:12px 20px;
margin:5px;
border:none;
border-radius:10px;
background:#74b9ff;
cursor:pointer;
}
button:hover{background:#0984e3;color:white;}
</style>
</head>

<body>

<h1>➕ Addition Challenge</h1>

<div class="game">
<div id="stars">☆☆☆☆☆☆☆☆☆☆</div>
<div id="problem"></div>
<div id="message"></div>
<div id="options"></div>
</div>

<!-- 🔊 AUDIO (MOST RELIABLE METHOD) -->
<audio id="correctSound" src="correct-bell-twinkle-jam-fx-1-00-05.mp3"></audio>
<audio id="wrongSound" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>

<script>

let questions=[]
let current=0
let score=0

const problem=document.getElementById("problem")
const optionsDiv=document.getElementById("options")
const message=document.getElementById("message")
const stars=document.getElementById("stars")

// 🎵 Get audio elements
const correctSound=document.getElementById("correctSound")
const wrongSound=document.getElementById("wrongSound")

// 🔓 Unlock audio on first click
document.addEventListener("click", ()=>{
correctSound.play().then(()=>correctSound.pause()).catch(()=>{})
wrongSound.play().then(()=>wrongSound.pause()).catch(()=>{})
}, {once:true})

function generatePair(){
let a=Math.floor(Math.random()*900)+100
let b=Math.floor(Math.random()*(999-a))
return [a,b]
}

function generateQuestions(){
questions=[]
for(let i=0;i<10;i++){
let [a,b]=generatePair()
questions.push({a,b,answer:a+b})
}
}

function showQuestion(){
message.textContent=""
let q=questions[current]
problem.innerHTML=`${q.a} + ${q.b} = ?`
createOptions(q.answer)
updateStars()
}

function createOptions(correct){

let opts=[correct]

while(opts.length<3){
let wrong=correct+(Math.floor(Math.random()*40)-20)
if(wrong>0 && !opts.includes(wrong)){
opts.push(wrong)
}
}

// shuffle properly
for(let i=opts.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
[opts[i],opts[j]]=[opts[j],opts[i]]
}

optionsDiv.innerHTML=""

opts.forEach(o=>{
let btn=document.createElement("button")
btn.textContent=o
btn.onclick=()=>answer(o)
optionsDiv.appendChild(btn)
})
}

const praise=["Great job!","Awesome!","Well done!","Super!"]

function answer(choice){

let correct=questions[current].answer

if(choice===correct){

score++
message.textContent=praise[Math.floor(Math.random()*praise.length)]

// 🔔 PLAY CORRECT SOUND
correctSound.currentTime=0
correctSound.play()

setTimeout(()=>{
current++
if(current<10){
showQuestion()
}else{
finishGame()
}
},3000)

}else{

message.textContent="Oops! Try again 😊"

// ❌ PLAY WRONG SOUND
wrongSound.currentTime=0
wrongSound.play()

}
}

function updateStars(){
let s=""
for(let i=0;i<10;i++){
s+=i<score?"⭐":"☆"
}
stars.textContent=s
}

function finishGame(){
optionsDiv.innerHTML=""
problem.innerHTML="🎉 Game Over"
message.innerHTML=`Score ${score}/10<br><br>`
let btn=document.createElement("button")
btn.textContent="Play Again"
btn.onclick=restartGame
optionsDiv.appendChild(btn)
}

function restartGame(){
current=0
score=0
generateQuestions()
showQuestion()
}

generateQuestions()
showQuestion()

</script>

</body>
</html>
