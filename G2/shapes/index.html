<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 2 Shapes Game</title>

<style>

body{
font-family:"Comic Sans MS", Arial;
background:linear-gradient(135deg,#ffeaa7,#81ecec);
text-align:center;
margin:0;
}

h1{color:#d63031}

.game{
max-width:650px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

canvas{
margin:20px;
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

button{
font-size:18px;
padding:10px 18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#74b9ff;
}

button:hover{
background:#0984e3;
color:white;
}

.stars{
font-size:28px;
margin-bottom:10px;
}

.message{
font-size:22px;
height:30px;
color:#e17055;
}

canvas#confetti{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>
</head>

<body>

<h1>🔷 Shape Detective 🔺</h1>

<div class="game">

<div class="stars" id="stars">☆☆☆☆☆☆☆☆☆☆</div>

<div class="message" id="message"></div>

<canvas id="shapeCanvas" width="220" height="220"></canvas>

<h3>What shape is this?</h3>

<div class="buttons" id="options"></div>

</div>

<canvas id="confetti"></canvas>

<script>

/* DATA */

const shapes=["circle","square","triangle","rectangle","pentagon","hexagon"]

let questions=[]
let current=0
let score=0

const canvas=document.getElementById("shapeCanvas")
const ctx=canvas.getContext("2d")
const stars=document.getElementById("stars")
const message=document.getElementById("message")
const optionsDiv=document.getElementById("options")

/* SOUNDS */

const correctSound=new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg")
const wrongSound=new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg")

/* GENERATE QUESTIONS */

function generateQuestions(){
questions=[]
for(let i=0;i<10;i++){
questions.push(shapes[Math.floor(Math.random()*shapes.length)])
}
}

/* DRAW SHAPE */

function drawShape(shape){

ctx.clearRect(0,0,canvas.width,canvas.height)

let size=Math.random()*50+60
let rotation=Math.random()*Math.PI

ctx.save()
ctx.translate(110,110)
ctx.rotate(rotation)

ctx.fillStyle="#ff7675"
ctx.strokeStyle="#2d3436"
ctx.lineWidth=4

ctx.beginPath()

if(shape==="circle"){
ctx.arc(0,0,size,0,Math.PI*2)
}

if(shape==="square"){
ctx.rect(-size/2,-size/2,size,size)
}

if(shape==="rectangle"){
ctx.rect(-size/2,-size/3,size,size/1.5)
}

if(shape==="triangle"){
ctx.moveTo(0,-size)
ctx.lineTo(size,size)
ctx.lineTo(-size,size)
ctx.closePath()
}

if(shape==="pentagon"){
for(let i=0;i<5;i++){
let angle=i*2*Math.PI/5
let x=size*Math.cos(angle)
let y=size*Math.sin(angle)
if(i===0)ctx.moveTo(x,y)
else ctx.lineTo(x,y)
}
ctx.closePath()
}

if(shape==="hexagon"){
for(let i=0;i<6;i++){
let angle=i*2*Math.PI/6
let x=size*Math.cos(angle)
let y=size*Math.sin(angle)
if(i===0)ctx.moveTo(x,y)
else ctx.lineTo(x,y)
}
ctx.closePath()
}

ctx.fill()
ctx.stroke()

ctx.restore()

}

/* CREATE OPTIONS */

function createOptions(correct){

let opts=[correct]

while(opts.length<3){

let rand=shapes[Math.floor(Math.random()*shapes.length)]

if(!opts.includes(rand)) opts.push(rand)

}

opts.sort(()=>Math.random()-0.5)

optionsDiv.innerHTML=""

opts.forEach(o=>{

let btn=document.createElement("button")

btn.textContent=o.charAt(0).toUpperCase()+o.slice(1)

btn.onclick=()=>answer(o)

optionsDiv.appendChild(btn)

})

}

/* SHOW QUESTION */

function showQuestion(){

message.textContent=""

let shape=questions[current]

drawShape(shape)

createOptions(shape)

updateStars()

}

/* ANSWER */

function answer(choice){

let correct=questions[current]

if(choice===correct){

score++
message.textContent="Correct!"
correctSound.play()
launchConfetti()

}else{

message.textContent="Wrong Answer"
wrongSound.play()

}

setTimeout(()=>{

current++

if(current<10){
showQuestion()
}else{
finishGame()
}

},900)

}

/* STARS */

function updateStars(){

let s=""

for(let i=0;i<10;i++){
s+=i<score?"⭐":"☆"
}

stars.textContent=s

}

/* FINISH */

function finishGame(){

optionsDiv.innerHTML=""
message.textContent=`Game Over! Score ${score}/10`

}

/* CONFETTI */

const confettiCanvas=document.getElementById("confetti")
const cctx=confettiCanvas.getContext("2d")

confettiCanvas.width=window.innerWidth
confettiCanvas.height=window.innerHeight

let confetti=[]

function launchConfetti(){

for(let i=0;i<60;i++){
confetti.push({
x:Math.random()*confettiCanvas.width,
y:0,
r:Math.random()*6+3,
color:`hsl(${Math.random()*360},100%,50%)`,
speed:Math.random()*3+2
})
}

}

function drawConfetti(){

cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height)

confetti.forEach((c,i)=>{

cctx.beginPath()
cctx.arc(c.x,c.y,c.r,0,Math.PI*2)
cctx.fillStyle=c.color
cctx.fill()

c.y+=c.speed

if(c.y>confettiCanvas.height) confetti.splice(i,1)

})

requestAnimationFrame(drawConfetti)

}

drawConfetti()

/* START */

generateQuestions()
showQuestion()

</script>

</body>
</html>
